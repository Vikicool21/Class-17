<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Javascript methods
    </h1>
    <script>
        var string = "Amazing";
        document.write(string.toUpperCase());
        document.write("<br>");
        document.write(string.toLowerCase());
        document.write("<br>");
        document.write(string.startsWith("A"));
    </script>
</body>
</html>
